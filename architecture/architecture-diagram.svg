<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="860" height="620" fill="#f8f9fa" rx="12"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">NexaSense — Arquitetura do Sistema IoT</text>
  <text x="430" y="54" text-anchor="middle" font-size="11" fill="#666">NexaHome Technologies · Avaliação de Segurança · 2026</text>

  <!-- ===== ESP32 Box ===== -->
  <rect x="260" y="80" width="340" height="280" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="10"/>
  <text x="430" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">ESP32-WROOM-32D</text>
  <text x="430" y="115" text-anchor="middle" font-size="10" fill="#3b5998">Microcontrolador (Xtensa LX6 dual-core)</text>

  <!-- Firmware block -->
  <rect x="280" y="126" width="140" height="50" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5" rx="6"/>
  <text x="350" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Firmware</text>
  <text x="350" y="162" text-anchor="middle" font-size="9" fill="#1e40af">ESP-IDF v5.1.2</text>
  <text x="350" y="173" text-anchor="middle" font-size="9" fill="#1e40af">App + Bootloader</text>

  <!-- Flash block -->
  <rect x="440" y="126" width="140" height="50" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5" rx="6"/>
  <text x="510" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Flash SPI</text>
  <text x="510" y="162" text-anchor="middle" font-size="9" fill="#1e40af">W25Q32 — 4 MB</text>
  <text x="510" y="173" text-anchor="middle" font-size="9" fill="#dc2626">⚠ SEM criptografia</text>

  <!-- UART block -->
  <rect x="280" y="196" width="130" height="50" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="345" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">UART0</text>
  <text x="345" y="232" text-anchor="middle" font-size="9" fill="#991b1b">USB-Serial CP2102</text>
  <text x="345" y="243" text-anchor="middle" font-size="9" fill="#dc2626">⚠ Debug exposto</text>

  <!-- JTAG block -->
  <rect x="430" y="196" width="130" height="50" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="495" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">JTAG</text>
  <text x="495" y="232" text-anchor="middle" font-size="9" fill="#991b1b">GPIO 12-15</text>
  <text x="495" y="243" text-anchor="middle" font-size="9" fill="#dc2626">⚠ Não desabilitado</text>

  <!-- Wi-Fi block -->
  <rect x="330" y="266" width="200" height="50" fill="#d1fae5" stroke="#059669" stroke-width="1.5" rx="6"/>
  <text x="430" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">Wi-Fi 802.11 b/g/n</text>
  <text x="430" y="302" text-anchor="middle" font-size="9" fill="#065f46">2,4 GHz · TCP/IP stack</text>
  <text x="430" y="313" text-anchor="middle" font-size="9" fill="#dc2626">⚠ MQTT sem TLS</text>

  <!-- DHT22 Sensor -->
  <rect x="60" y="156" width="130" height="60" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" rx="6"/>
  <text x="125" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#713f12">DHT22</text>
  <text x="125" y="196" text-anchor="middle" font-size="9" fill="#713f12">Temperatura e Umidade</text>
  <text x="125" y="209" text-anchor="middle" font-size="9" fill="#713f12">Sensor Ambiental</text>
  <line x1="190" y1="186" x2="258" y2="210" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow-yellow)"/>
  <text x="215" y="196" font-size="9" fill="#92400e">I²C / GPIO</text>

  <!-- UART Debug path -->
  <rect x="60" y="256" width="130" height="50" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="125" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Atacante</text>
  <text x="125" y="292" text-anchor="middle" font-size="9" fill="#991b1b">Acesso físico UART</text>
  <text x="125" y="303" text-anchor="middle" font-size="9" fill="#dc2626">Log completo de boot</text>
  <line x1="190" y1="281" x2="278" y2="230" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

  <!-- Network -->
  <rect x="240" y="420" width="380" height="50" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" rx="6"/>
  <text x="430" y="443" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Rede de Laboratório</text>
  <text x="430" y="458" text-anchor="middle" font-size="9" fill="#0c4a6e">192.168.1.0/24 — Isolada</text>
  <line x1="430" y1="316" x2="430" y2="418" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- MQTT Broker -->
  <rect x="240" y="520" width="175" height="70" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="327" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Broker MQTT</text>
  <text x="327" y="557" text-anchor="middle" font-size="9" fill="#14532d">Mosquitto · 192.168.1.10</text>
  <text x="327" y="571" text-anchor="middle" font-size="9" fill="#dc2626">⚠ Porta 1883 sem TLS</text>
  <text x="327" y="583" text-anchor="middle" font-size="9" fill="#dc2626">⚠ allow_anonymous true</text>
  <line x1="360" y1="470" x2="340" y2="518" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Monitoring Platform -->
  <rect x="445" y="520" width="175" height="70" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" rx="6"/>
  <text x="532" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#581c87">Plataforma</text>
  <text x="532" y="557" text-anchor="middle" font-size="9" fill="#581c87">de Monitoramento</text>
  <text x="532" y="571" text-anchor="middle" font-size="9" fill="#581c87">Dashboard / API</text>
  <line x1="415" y1="555" x2="443" y2="555" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- OTA Server -->
  <rect x="670" y="156" width="160" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6"/>
  <text x="750" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Servidor OTA</text>
  <text x="750" y="196" text-anchor="middle" font-size="9" fill="#78350f">http://192.168.1.10:8080</text>
  <text x="750" y="209" text-anchor="middle" font-size="9" fill="#dc2626">⚠ HTTP sem assinatura</text>
  <line x1="600" y1="210" x2="668" y2="193" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-orange)"/>
  <text x="635" y="202" font-size="9" fill="#92400e">OTA pull</text>

  <!-- MitM Attacker -->
  <rect x="670" y="420" width="160" height="50" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="750" y="442" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Atacante MitM</text>
  <text x="750" y="458" text-anchor="middle" font-size="9" fill="#dc2626">Sniff / inject MQTT</text>
  <line x1="622" y1="445" x2="668" y2="445" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

  <!-- Legend -->
  <rect x="30" y="490" width="190" height="110" fill="white" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="125" y="508" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Legenda</text>
  <line x1="45" y1="520" x2="75" y2="520" stroke="#059669" stroke-width="2"/>
  <text x="80" y="524" font-size="9" fill="#374151">Fluxo de dados normal</text>
  <line x1="45" y1="535" x2="75" y2="535" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="80" y="539" font-size="9" fill="#374151">Vetor de ataque</text>
  <rect x="45" y="547" width="12" height="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1" rx="2"/>
  <text x="62" y="558" font-size="9" fill="#374151">Interface vulnerável</text>
  <rect x="45" y="565" width="12" height="12" fill="#d1fae5" stroke="#059669" stroke-width="1" rx="2"/>
  <text x="62" y="576" font-size="9" fill="#374151">Comunicação de rede</text>
  <rect x="45" y="583" width="12" height="12" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1" rx="2"/>
  <text x="62" y="594" font-size="9" fill="#374151">Componente interno ESP32</text>

  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ca8a04"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
    </marker>
  </defs>
</svg>
